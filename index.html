<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pede Aqui — cardápio digital e pedidos para restaurantes." />
    <title>Pede Aqui | Cardápio digital e pedidos</title>
    <script>
      (function () {
        var redirect = sessionStorage.getItem('pedeaqui-redirect');
        if (redirect) {
          sessionStorage.removeItem('pedeaqui-redirect');
          history.replaceState(null, '', '/pede-aqui' + redirect);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
