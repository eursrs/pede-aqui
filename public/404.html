<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>carda.io</title>
    <script>
      // GitHub Pages não faz reescrita de SPA: esta página devolve o caminho ao index.html.
      var base = '/carda-io/';
      var target = window.location.pathname.replace(base, '') + window.location.search + window.location.hash;
      sessionStorage.setItem('cardaio-redirect', target);
      window.location.replace(base);
    </script>
  </head>
  <body>Redirecionando para o carda.io…</body>
</html>
